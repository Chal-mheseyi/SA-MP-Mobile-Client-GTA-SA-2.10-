name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep the SAME debug signing key between builds, so a new APK can be installed over the old
      # one without uninstalling (uninstalling deletes the game files in Android/data).
      - name: Restore fixed debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android NDK 28
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleVer_releaseRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: samp-client-apk
          path: app/build/outputs/apk/ver_release/release/*.apk
